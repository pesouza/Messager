name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Messager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Messager-apk
          path: Messager.apk

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Messager.apk \
            --target "$GITHUB_SHA" \
            --title "Messager (${GITHUB_REF_NAME})" \
            --notes "APK gerado automaticamente a partir de ${GITHUB_SHA::7}. Baixe o arquivo Messager.apk no celular e instale." \
            --prerelease
